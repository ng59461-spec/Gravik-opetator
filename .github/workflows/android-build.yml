name: Build GRAVIK OPERADOR V2
on:
  workflow_dispatch:
  push:
    branches: [ "main", "gravik-operador-v2" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validate JavaScript
        run: |
          node --check app/src/main/assets/technical-data.js
          node --check app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload V2 test APK
        uses: actions/upload-artifact@v4
        with:
          name: GRAVIK-OPERADOR-V2-test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
